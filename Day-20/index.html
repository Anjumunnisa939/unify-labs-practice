<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Async Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>Async User Dashboard</h1>

<div class="card">
    <p id="status">Initializing...</p>
</div>

<div class="card">
    <p>Clock:</p>
    <h2 id="clock"></h2>
</div>

<div class="card">
    <button id="loadBtn">Load User</button>
    <div id="user"></div>
</div>

<div class="card">
    <button id="eventBtn">Event Loop Demo</button>
    <p id="eventOutput"></p>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
